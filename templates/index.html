<!DOCTYPE html>
<html>
<head>
    <title>My App</title>
</head>
<body>

    <h1>Welcome!</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

    {% if name %}
        <h2>Hello, {{ name }}!</h2>
    {% endif %}

</body>
</html>
